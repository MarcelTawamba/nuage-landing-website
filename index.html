  <body class="bg-white text-gray-900">
    <!-- Hero Section with Gradient Container -->
    <div style="background: linear-gradient(to bottom, rgba(19, 86, 247, 0.25) 0%, rgba(19, 86, 247, 0.15) 15%, rgba(19, 86, 247, 0.08) 30%, rgba(19, 86, 247, 0.04) 45%, rgba(19, 86, 247, 0.02) 55%, rgba(255, 255, 255, 0.95) 70%, rgba(255, 255, 255, 1) 80%, rgba(255, 255, 255, 1) 100%);">

    <div id="audience-section"></div>

    <div id="individuals-section"></div>

    <div id="businesses-section"></div>

    <div id="dark-promotion-section"></div>

    <div id="rewards-section"></div>

    <div id="cta-section"></div>

    <div id="faq-section"></div>

    <div id="feature-section-1"></div>

    <script>
      // Fallback timeout to show page even if sections fail to load
      setTimeout(function() {
        if (!document.body.classList.contains('loaded')) {
          console.warn('Forcing page to show after timeout');
          document.body.classList.add('loaded');
        }
      }, 2000);

      // Wait for DOM to be fully loaded
      document.addEventListener('DOMContentLoaded', function() {
        // Initialize Lucide icons if available
        if (typeof lucide !== 'undefined' && lucide.createIcons) {
          lucide.createIcons();
          console.log('Lucide icons initialized');
        } else {
          console.error('Lucide not loaded properly');
        }

        // Load sections dynamically
        async function loadSection(sectionId, filename) {
          try {
            console.log(`Loading section: ${filename} into ${sectionId}`);
            const response = await fetch(`sections/${filename}`);
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            const html = await response.text();
            const element = document.getElementById(sectionId);
            if (element) {
              element.innerHTML = html;
              console.log(`Section ${filename} loaded successfully`);
            } else {
              console.error(`Element ${sectionId} not found`);
            }
          } catch (error) {
            console.error(`Error loading ${filename}:`, error);
            // Continue even if one section fails
          }
        }

        // Load all sections
        Promise.all([
          loadSection('hero-section', 'herosection2.html'),
          loadSection('audience-section', 'audiencesection.html'),
          loadSection('individuals-section', 'individualsection.html'),
          loadSection('businesses-section', 'businesssection.html'),
          loadSection('dark-promotion-section', 'darkpromotionsection.html'),
          loadSection('rewards-section', 'rewardssection.html'),
          loadSection('cta-section', 'ctasection.html'),
          loadSection('faq-section', 'faqsection.html'),
          loadSection('feature-section-1', 'featuresection1.html')
        ]).then(() => {
          console.log('All sections loaded, initializing functionality...');

          // Reinitialize icons after all sections are loaded
          if (typeof lucide !== 'undefined' && lucide.createIcons) {
            lucide.createIcons();
            console.log('Lucide icons reinitialized');
          }

          // Initialize all interactive functionality after sections are loaded
          initializeFeatureFunctionality();
          initializeFAQFunctionality();
          initializeNavigation();

        }).catch((error) => {
          console.error('Error during section loading:', error);
          // Show page anyway
          document.body.classList.add('loaded');
        });

        // Initialize feature functionality after sections are loaded
        function initializeFeatureFunctionality() {
          // Add loading states to feature displays
          const individualDisplay = document.getElementById('feature-display-individual');
          const businessDisplay = document.getElementById('feature-display-business');
          
          // Show loading skeleton initially for individual display
          if (individualDisplay) {
            individualDisplay.innerHTML = `
              <div class="text-center">
                <div class="w-24 h-24 loading-skeleton rounded-2xl mx-auto mb-6"></div>
                <div class="h-4 loading-skeleton rounded w-32 mx-auto mb-2"></div>
                <div class="h-3 loading-skeleton rounded w-24 mx-auto"></div>
              </div>
            `;
          }
          
          // Show loading skeleton initially for business display
          if (businessDisplay) {
            businessDisplay.innerHTML = `
              <div class="text-center">
                <div class="w-24 h-24 loading-skeleton rounded-2xl mx-auto mb-6"></div>
                <div class="h-4 loading-skeleton rounded w-32 mx-auto mb-2"></div>
                <div class="h-3 loading-skeleton rounded w-24 mx-auto"></div>
              </div>
            `;
          }

          // Load individual features data from the section
          let individualFeatures = {};
          const individualDataElement = document.getElementById('individual-features-data');
          if (individualDataElement) {
            try {
              individualFeatures = JSON.parse(individualDataElement.textContent);
            } catch (e) {
              console.warn('Failed to parse individual features data:', e);
              individualFeatures = {};
            }
          }

          // Load business features data from the section
          let businessFeatures = {};
          const businessDataElement = document.getElementById('business-features-data');
          if (businessDataElement) {
            try {
              businessFeatures = JSON.parse(businessDataElement.textContent);
            } catch (e) {
              console.warn('Failed to parse business features data:', e);
              businessFeatures = {};
            }
          }

          // Optimized feature update function
          function updateFeatureDisplay(display, feature) {
            if (!display || !feature) return;
            
            // Use requestAnimationFrame for smooth transitions
            requestAnimationFrame(() => {
              display.style.opacity = '0.7';
              display.style.transform = 'scale(0.98) translateZ(0)';
              
              setTimeout(() => {
                // Special handling for Payment Links feature
                if (feature.title === 'Payment Links') {
                  // Remove ALL spacing and make image touch the top
                  const container = display.closest('.feature-display');
                  if (container) {
                    // Remove all padding from container
                    container.classList.remove('p-4', 'md:p-6', 'lg:p-8');
                    container.classList.add('p-0');
                    // Override the flex centering to align to top
                    container.classList.remove('items-center');
                    container.classList.add('items-start');
                  }
                  
                  // Remove all padding and margins from display
                  display.style.padding = '0';
                  display.style.margin = '0';
                  
                  display.innerHTML = `
                    <img src="img/payment_request.svg" alt="Payment Links" class="w-full h-auto max-h-[300px] md:max-h-[400px] object-contain mb-4 md:mb-6 mx-auto -mt-4 md:-mt-6 lg:-mt-8">
                    <div class="flex flex-wrap justify-center gap-4 md:gap-6 text-sm text-gray-500 max-w-md mx-auto">
                      ${feature.bullets ? feature.bullets.map(bullet => `
                        <div class="flex items-center gap-2">
                          <i data-lucide="check" class="w-4 h-4 text-green-500 flex-shrink-0"></i>
                          <span class="font-light tracking-wide">${bullet}</span>
                        </div>
                      `).join('') : ''}
                    </div>
                  `;
                } else {
                  // Reset padding for other features
                  const container = display.closest('.feature-display');
                  if (container) {
                    // Reset all padding classes
                    container.classList.remove('p-0');
                    container.classList.add('p-4', 'md:p-6', 'lg:p-8');
                    // Reset the flex centering for other features
                    container.classList.remove('items-start');
                    container.classList.add('items-center');
                  }
                  
                  // Reset all padding and margins for other features
                  display.style.padding = '';
                  display.style.margin = '';
                  
                  // Default handling for other features
                  display.innerHTML = `
                    <div class="w-24 h-24 ${feature.color} rounded-2xl mx-auto mb-8 flex items-center justify-center">
                      <i data-lucide="${feature.icon}" class="w-12 h-12 text-white"></i>
                    </div>
                    <h3 class="font-bold text-xl mb-8 tracking-tight">${feature.title}</h3>
                    <div class="space-y-3 text-sm text-gray-500 max-w-xs mx-auto">
                      ${feature.bullets ? feature.bullets.map(bullet => `
                        <div class="flex items-center gap-3">
                          <i data-lucide="check" class="w-4 h-4 text-green-500 flex-shrink-0"></i>
                          <span class="font-light tracking-wide">${bullet}</span>
                        </div>
                      `).join('') : ''}
                    </div>
                  `;
                }
                
                // Reinitialize icons for the new content
                lucide.createIcons();
                
                // Smooth transition back
                requestAnimationFrame(() => {
                  display.style.opacity = '1';
                  display.style.transform = 'scale(1) translateZ(0)';
                });
              }, 150);
            });
          }


          // Individual features functionality
          const individualItems = document.querySelectorAll('.feature-item-individual');
          
          individualItems.forEach(item => {
            item.addEventListener('click', function() {
              const featureKey = this.getAttribute('data-feature');
              const feature = individualFeatures[featureKey];
              
              if (feature && individualDisplay) {
                updateFeatureDisplay(individualDisplay, feature);
                
                // Update active state
                individualItems.forEach(fi => fi.classList.remove('active'));
                this.classList.add('active');
              }
            });
          });

          // Business features functionality with throttling
          const businessItems = document.querySelectorAll('.feature-item-business');
          let businessTimeout = null;

          businessItems.forEach(item => {
            item.addEventListener('click', function() {
              // Throttle rapid clicks
              if (businessTimeout) return;
              
              const featureKey = this.getAttribute('data-feature');
              const feature = businessFeatures[featureKey];
              
              if (feature && businessDisplay) {
                businessTimeout = setTimeout(() => {
                  businessTimeout = null;
                }, 300);
                
                updateFeatureDisplay(businessDisplay, feature);
                
                // Update active state
                businessItems.forEach(fi => fi.classList.remove('active'));
                this.classList.add('active');
              }
            });
          });


          // Set initial active states
          if (individualItems.length > 0) {
            individualItems[0].classList.add('active');
            // Trigger initial display for individuals
            const firstIndividualFeature = individualFeatures['receive'];
            if (firstIndividualFeature && individualDisplay) {
              updateFeatureDisplay(individualDisplay, firstIndividualFeature);
            }
          }
          if (businessItems.length > 0) {
            businessItems[0].classList.add('active');
            // Trigger initial display for businesses
            const firstBusinessFeature = businessFeatures['invoicing'];
            if (firstBusinessFeature && businessDisplay) {
              updateFeatureDisplay(businessDisplay, firstBusinessFeature);
            }
          }

          // Show feature content after a short delay
          setTimeout(() => {
            const featureContents = document.querySelectorAll('.feature-content');
            featureContents.forEach(content => {
              content.classList.add('loaded');
            });
          }, 100);
        }

        // Optimized Intersection Observer with throttling
        const animatedSections = new Set();
        let observerTimeout = null;
        
        const observerOptions = {
          threshold: 0.1,
          rootMargin: '0px 0px -100px 0px' // Increased margin for better performance
        };
        
        const observer = new IntersectionObserver((entries) => {
          // Throttle observer callbacks
          if (observerTimeout) return;
          
          observerTimeout = setTimeout(() => {
            observerTimeout = null;
          }, 100);
          
          entries.forEach(entry => {
            if (entry.isIntersecting && !animatedSections.has(entry.target)) {
              // Use requestAnimationFrame for smooth class addition
              requestAnimationFrame(() => {
                entry.target.classList.add('content-ready');
                animatedSections.add(entry.target);
                
                // Stop observing this element once it's been animated
                observer.unobserve(entry.target);
              });
            }
          });
        }, observerOptions);
        
        // Observe sections with delay to avoid blocking initial load
        setTimeout(() => {
          document.querySelectorAll('section').forEach(section => {
            observer.observe(section);
          });
        }, 500);

        // Show the page when everything is ready
        document.body.classList.add('loaded');
        
        // Add scroll performance optimization
        let ticking = false;
        
        function updateOnScroll() {
          ticking = false;
        }
        
        function requestTick() {
          if (!ticking) {
            requestAnimationFrame(updateOnScroll);
            ticking = true;
          }
        }
        
        // Throttle scroll events
        window.addEventListener('scroll', requestTick, { passive: true });
        
        // Initialize navigation functionality after sections are loaded
        function initializeNavigation() {
          // Smooth scroll functionality for navigation links
          document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
              e.preventDefault();
              const targetId = this.getAttribute('href').substring(1);
              const targetElement = document.getElementById(targetId);
              
              if (targetElement) {
                targetElement.scrollIntoView({
                  behavior: 'smooth',
                  block: 'start'
                });
                
                // Prevent /index.html from appearing in URLs
                if (window.location.pathname !== '/') {
                  history.replaceState(null, null, window.location.origin + '/#' + targetId);
                }
              }
            });
          });
          
          // Fix navigation anchor links on page load
          if (window.location.hash) {
            const targetId = window.location.hash.substring(1);
            const targetElement = document.getElementById(targetId);
            if (targetElement) {
              setTimeout(() => {
                targetElement.scrollIntoView({
                  behavior: 'smooth',
                  block: 'start'
                });
              }, 100);
            }
          }
        }

        // Initialize FAQ functionality after sections are loaded
        function initializeFAQFunctionality() {
          // FAQ Dropdown functionality with accessibility improvements
          document.querySelectorAll('.faq-question').forEach(button => {
            button.addEventListener('click', function() {
              const faqItem = this.closest('.faq-item');
              const answer = faqItem.querySelector('.faq-answer');
              const icon = this.querySelector('i');
              const isOpen = this.getAttribute('aria-expanded') === 'true';
              
              // Close all other FAQ items
              document.querySelectorAll('.faq-answer').forEach(item => {
                item.style.maxHeight = '0px';
              });
              document.querySelectorAll('.faq-question').forEach(item => {
                item.setAttribute('aria-expanded', 'false');
                const itemIcon = item.querySelector('i');
                if (itemIcon) {
                  itemIcon.style.transform = 'rotate(0deg)';
                }
              });
              
              // Toggle current item
              if (!isOpen) {
                answer.style.maxHeight = answer.scrollHeight + 'px';
                icon.style.transform = 'rotate(180deg)';
                this.setAttribute('aria-expanded', 'true');
              } else {
                answer.style.maxHeight = '0px';
                icon.style.transform = 'rotate(0deg)';
                this.setAttribute('aria-expanded', 'false');
              }
            });
            
            // Add keyboard support for FAQ items
            button.addEventListener('keydown', function(e) {
              if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                this.click();
              }
            });
          });
        }
      });
    </script>
